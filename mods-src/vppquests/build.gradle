plugins {
    id "java-library"
    id "eclipse"
    id "idea"
    id "maven-publish"
    id "net.neoforged.moddev" version "2.0.78"
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = minecraft_version
        mappingsVersion = "2024.11.17"
    }

    runs {
        client {
            client()
            systemProperty "neoforge.enabledGameTestNamespaces", mod_id
        }
        server {
            server()
            systemProperty "neoforge.enabledGameTestNamespaces", mod_id
            programArgument "--nogui"
        }
        data {
            data()
            programArguments.addAll "--mod", mod_id, "--all", "--output",
                    file("src/generated/resources/").getAbsolutePath(),
                    "--existing", file("src/main/resources/").getAbsolutePath()
        }
        configureEach {
            systemProperty "forge.logging.markers", ""
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir "src/generated/resources" }

repositories {
    mavenCentral()
}

// #194: unit tests for the pure/seam pieces of vppquests (data model parsing,
// registry, the GamestageBridge/QuestRewardBridge pack-glue seams, and the
// network payload codecs). No test infra existed for this mod before this -
// convention copied verbatim from mods-src/vppskills/build.gradle's #163
// phase-2 setup. The test sourceSet's classpath is deliberately widened to
// exactly match sourceSets.main's (rather than relying on whatever
// "implementation"-derived classpath the java-library plugin would otherwise
// give "testImplementation") because net.neoforged.moddev attaches the
// resolved NeoForge/Minecraft jars straight onto the MAIN sourceSet's
// compile/runtime classpaths, not through a config testImplementation extends
// by default - tests need the exact same Minecraft/NeoForge classes
// (ResourceLocation, Codec, etc.) this mod's own main code compiles against.
sourceSets {
    test {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

dependencies {
    // Pinned to the exact JUnit 5.10.2 already present in this environment's
    // Gradle dependency cache (no version bump of any mod/lockfile dependency
    // here - this is a brand-new test-only dependency, the mod's own
    // NeoForge/Minecraft/library pins in gradle.properties are untouched).
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
}

tasks.named("test", Test).configure {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.named("processResources", ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(["META-INF/neoforge.mods.toml"]) {
        expand replaceProperties + [project: project]
    }
}

publishing {
    publications {
        register("mavenJava", MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

// #145: make the mod jar byte-reproducible so its lockfile-pinned hash is
// stable across independent Gradle builds (was nondeterministic: timestamps +
// file ordering differed every build, breaking mods.lock.json sha verification).
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
