modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Guno327/vanillaplusplus/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

# Phase 1 (#163) only READS puffish_skills' generated tree JSON at build time
# (see build.gradle's importSkillTreeData task) - it does not call any of
# puffish_skills' Java API, so there is no dependency on that mod at all,
# not even optional. This mod is standalone client-only content in this
# phase (see ClientOnlyScreens.java doc); nothing here requires the server.
